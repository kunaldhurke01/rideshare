<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="rsGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="rsGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark 3D Background Shield/Hexagon -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="#0b132b" stroke="url(#rsGrad1)" stroke-width="2" />
  
  <!-- Path A (Cyan) sweeping from bottom left to center-top -->
  <path d="M16 48 C16 34, 26 26, 32 20" stroke="url(#rsGrad2)" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)"/>
  
  <!-- Path B (Purple/Blue) sweeping from bottom right to center-top, merging with Path A -->
  <path d="M48 48 C48 34, 38 26, 32 20" stroke="url(#rsGrad1)" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)"/>
  
  <!-- Combined Route continuing to apex -->
  <path d="M32 20 L32 12" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" />

  <!-- Waypoint / Pin at the merger point with 3D ring -->
  <circle cx="32" cy="14" r="5" fill="#38bdf8" />
  <circle cx="32" cy="14" r="2.2" fill="#ffffff" />
  
  <!-- Origin dots -->
  <circle cx="16" cy="48" r="3" fill="#10b981" />
  <circle cx="48" cy="48" r="3" fill="#8b5cf6" />
</svg>
